<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        /* Menghilangkan bullet/titik list dan margin/padding bawaan browser */
ul {
    list-style-type: none;
    margin: 0;
    padding: 0;
    background-color: #333333; /* Warna latar belakang navbar */
    overflow: hidden;
}

/* Membuat list item berjejer ke samping (horizontal) */
li {
    float: left; /* Alternatif modern bisa menggunakan display: inline-block atau display: flex pada ul */
}

/* Styling untuk teks/link di dalam navbar */
li a {
    display: block;
    color: white;
    text-align: center;
    padding: 14px 20px;
    text-decoration: none;
}

/* Efek saat kursor berada di atas menu (hover) */
li a:hover {
    background-color: #2563eb; /* Warna berubah saat di-hover */
}
    </style>
    <!-- Navbar Horizontal -->
<ul>
    <li><a href="#home">Home</a></li>
    <li><a href="#news">News</a></li>
    <li><a href="#contact">Contact</a></li>
    <li><a href="#about">About</a></li>
</ul>
</body>
</html>
