<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        /* Styling untuk Navbar Vertical */
.vertical-nav {
    list-style-type: none; /* Menghilangkan titik/bullet pada list */
    margin: 0;
    padding: 0;
    width: 220px;          /* Lebar container navbar */
    background-color: #f8fafc; /* Warna latar belakang */
    border: 1px solid #cbd5e1; /* Garis tepi tipis */
    border-radius: 8px;    /* Membuat sudut melengkung */
    overflow: hidden;      /* Memastikan isi tidak keluar dari border-radius */
}

/* Styling untuk setiap item list */
.vertical-nav li {
    border-bottom: 1px solid #e2e8f0; /* Garis pemisah antar menu */
}

/* Menghilangkan garis pemisah pada item terakhir */
.vertical-nav li:last-child {
    border-bottom: none;
}

/* Styling untuk link di dalam navbar */
.vertical-nav li a {
    display: block;        /* Membuat link memenuhi area list */
    color: #334155;        /* Warna teks */
    padding: 12px 16px;    /* Ruang dalam (padding) */
    text-decoration: none; /* Menghilangkan garis bawah link */
    font-weight: 500;
    transition: background-color 0.2s ease, color 0.2s ease;
}

/* Efek saat kursor berada di atas menu (hover) */
.vertical-nav li a:hover {
    background-color: #2563eb; /* Warna latar saat di-hover */
    color: #ffffff;            /* Warna teks berubah jadi putih */
}
    </style>
    <!-- Navbar Vertical -->
<ul class="vertical-nav">
    <li><a href="#home">Home</a></li>
    <li><a href="#news">News</a></li>
    <li><a href="#contact">Contact</a></li>
    <li><a href="#about">About</a></li>
</ul>
</body>
</html>
